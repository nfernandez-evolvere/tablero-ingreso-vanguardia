* { box-sizing: border-box; }
body {

.app { max-width: 1440px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-fg); }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }

.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.aviso { font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--warning-subtle); color: var(--warning); font-weight: 500; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--card); font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--muted); }
.btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn-primary:hover:not(:disabled) { background: var(--primary); opacity: .9; }
.btn:disabled { opacity: .45; }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-danger { color: var(--danger); }

/* Tarjetas de resumen */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi-label { font-size: 13px; color: var(--muted-fg); display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.kpi-sub { font-size: 12px; color: var(--muted-fg); }
.kpi.cen .kpi-value { color: var(--cen); }
.kpi.sar .kpi-value { color: var(--sar); }
.kpi.dep .kpi-value { color: var(--dep); }

.dot.cen { background: var(--cen); } .dot.sar { background: var(--sar); } .dot.dep { background: var(--dep); }

.bar > span { display: block; height: 100%; background: var(--fg); border-radius: 999px; transition: width .25s ease; }

.panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; }

.check input { accent-color: var(--fg); width: 15px; height: 15px; }
.lista { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }

.volver:hover { background: var(--muted); }

.b-pend { background: var(--danger-subtle); color: var(--danger); }

.b-var { background: var(--info-subtle); color: var(--info); font-size: 10.5px; padding: 1px 6px; }

.c-cen { color: var(--cen); } .c-sar { color: var(--sar); } .c-dep { color: var(--dep); }
.talle { font-weight: 700; font-size: 15px; }

function renderTabla(r, a) {

const n0 = (n) => (n === 0 ? `<span class="cero">0</span>` : n);
function filaHtml(r, a, v, editable) {
  const k = claveVar(a, v); const s = VAR[k]; const sug = SUG[k];
  const val = valores(r, k); const err = validar(k, val);
  const sugCell = (n, cls) => `<span class="sug ${n ? cls : 'z'}">${n}</span>`;
  return `<tr class="fila" data-k="${esc(k)}">
    <td class="izq">${esc(v.colorNombre)}</td>
    <td><span class="talle">${esc(v.talle || 'Único')}</span>${v.nueva ? ' <span class="badge b-var" title="Esta combinación de color y talle entra por primera vez">Nuevo</span>' : ''}</td>

    <td>${stepperHtml(k, 'sar', val, err, editable, v)}</td>
    <td><span class="calc num ${err ? 'error' : ''}" data-dep>${err ? '—' : libreDe(k) - val.cen - val.sar}</span></td>
    <td class="estado-celda" data-estado>${estadoCelda(r, k, err, editable)}</td>
  </tr>`;
}
/* Límites de los botones: el «−» no baja de 0 y el «+» no pasa lo que hay en el depósito. */
function limitesPaso(k, campo, val) {
  const valido = Number.isInteger(val.cen) && Number.isInteger(val.sar);
  return { menos: !valido || !(val[campo] > 0), mas: !valido || val.cen + val.sar >= libreDe(k) };
}
function stepperHtml(k, campo, val, err, editable, v) {
  const nombre = UB[campo]; const lim = limitesPaso(k, campo, val);
  const dis = (b) => (!editable || b ? 'disabled' : '');
  return `<span class="stepper ${campo} ${err ? 'error' : ''} ${editable ? '' : 'off'}" data-stepper="${campo}">
    <input class="campo" id="${campo}-${esc(k)}" data-campo="${campo}" inputmode="numeric" aria-label="${nombre}, talle ${esc(v.talle)} ${esc(v.colorNombre)}" value="${Number.isInteger(val[campo]) ? val[campo] : ''}" ${editable ? '' : 'disabled'}>
    <span class="pasos"><button type="button" class="paso" data-paso="1" data-campo="${campo}" tabindex="-1" aria-label="Sumar uno a ${nombre}" ${dis(lim.mas)}>+</button><button type="button" class="paso" data-paso="-1" data-campo="${campo}" tabindex="-1" aria-label="Restar uno a ${nombre}" ${dis(lim.menos)}>−</button></span>
  </span>`;
}
function estadoCelda(r, k, err, editable) {
  const st = stR(r); const c = st.conf[k];
  if (confirmada(r, k)) {
    return `<span class="ok">✓ Confirmado</span>${corregida(c) ? ' <span class="chip">Corregido</span>' : ''}${c.ajustado ? ' <span class="chip warn">Ajustado al stock</span>' : ''}${err ? `<span class="err-msg">${err}</span>` : ''}`;
  }
  if (!editable) return `<span class="muted">Sin confirmar</span>`;
  return `<button class="btn btn-sm" type="button" data-accion="aceptar" ${err ? 'disabled' : ''}>Aceptar</button>${err ? `<span class="err-msg">${err}</span>` : ''}`;
}

function renderTodo() { renderKpis(); renderRemitos(); renderArticulos(); renderCarril(); renderDerecha(); }

/* ---------- Acciones ---------- */
function aceptar(r, k) {
  const st = stR(r); const val = valores(r, k);
  if (validar(k, val)) return;
  st.conf[k] = { cen: val.cen, sar: val.sar, sug: { ...SUG[k] }, por: USUARIO, at: ahora() };
  delete st.draft[k];
  if (st.estado === 'nuevo') st.estado = 'en_curso';
}
function actualizarFila(tr) {

  const val = valores(r, k); const err = validar(k, val);

    g.classList.toggle('error', !!err);
    const lim = limitesPaso(k, g.dataset.stepper, val);

  dep.textContent = err ? '—' : libreDe(k) - val.cen - val.sar;

function mostrarHoja(r) {

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#capa').innerHTML) $('#capa').innerHTML = ''; });

function fijarValor(tr, campo, n) {
  const r = remitoSel(); const k = tr.dataset.k;
  const st = stR(r); const actual = valores(r, k);
  st.draft[k] = { ...actual, [campo]: n };
  const c = st.conf[k];
  if (c && st.draft[k].cen === c.cen && st.draft[k].sar === c.sar) delete st.draft[k];
  guardar(); actualizarFila(tr);
}
function pasar(tr, campo, delta) {
  const input = tr.querySelector(`.campo[data-campo="${campo}"]`);
  if (!input || input.disabled) return;
  const k = tr.dataset.k; const val = valores(remitoSel(), k);
  const lim = limitesPaso(k, campo, val);
  if ((delta > 0 && lim.mas) || (delta < 0 && lim.menos)) return;
  const n = (Number.isInteger(val[campo]) ? val[campo] : 0) + delta;
  input.value = n;
  fijarValor(tr, campo, n);
}
document.addEventListener('input', (e) => {
  const campo = e.target.closest('.campo'); if (!campo) return;
  const txt = campo.value.trim();
  fijarValor(campo.closest('tr'), campo.dataset.campo, txt === '' ? NaN : Number(txt));
});
document.addEventListener('keydown', (e) => {
  const campo = e.target.closest && e.target.closest('.campo');
  if (!campo || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  pasar(campo.closest('tr'), campo.dataset.campo, e.key === 'ArrowUp' ? 1 : -1);
});

document.addEventListener('click', (e) => {
  const t = e.target;
  const paso = t.closest('[data-paso]');
  if (paso) { pasar(paso.closest('tr'), paso.dataset.campo, Number(paso.dataset.paso)); return; }
  const bRem = t.closest('[data-remito]');
  if (bRem) {
    const r = REMITOS.find((x) => x.codigo === bRem.dataset.remito);
    E.sel = { remito: r.codigo, articulo: r.articulos[0]?.codigo || null };
    guardar(); renderTodo(); $('#volver')?.focus({ preventScroll: true }); return;
  }
  if (t.closest('#volver')) { E.sel = { remito: null, articulo: null }; guardar(); renderTodo(); $('#vista-remitos .item')?.focus({ preventScroll: true }); return; }
  const bArt = t.closest('[data-articulo]');

  const acc = t.closest('[data-accion]'); if (!acc) return;
  const r = remitoSel(); if (!r) return; const st = stR(r);
  const a = r.articulos.find((x) => x.codigo === E.sel.articulo);
  switch (acc.dataset.accion) {
    case 'aceptar': aceptar(r, acc.closest('tr').dataset.k); break;
    case 'aceptar-articulo': a.variantes.forEach((v) => aceptar(r, claveVar(a, v))); break;
    case 'restablecer': a.variantes.forEach((v) => { const k = claveVar(a, v); delete st.conf[k]; delete st.draft[k]; });
      if (st.estado === 'en_curso' && !Object.keys(st.conf).length) st.estado = 'nuevo'; break;
    case 'pendiente':
      dialogo({ titulo: 'Dejar pendiente', texto: 'Lo que ya confirmaste queda guardado. Al retomarlo, el stock y la propuesta se recalculan con los datos de ese día.', etiqueta: 'Motivo (opcional)', obligatorio: false, confirmar: 'Dejar pendiente',
        alConfirmar: (m) => { st.estado = 'pendiente'; st.pendiente = { motivo: m, por: USUARIO, at: ahora() }; E.sel = { remito: null, articulo: null }; guardar(); renderTodo(); } });
      return;
    case 'retomar': {
      st.estado = Object.keys(st.conf).length ? 'en_curso' : 'nuevo';
      Object.entries(st.conf).forEach(([k, c]) => {
        const libre = libreDe(k);
        while (c.cen + c.sar > libre) { if (c.cen >= c.sar && c.cen > 0) c.cen--; else if (c.sar > 0) c.sar--; else break; c.ajustado = true; }
        c.sug = { ...SUG[k] };
      });
      st.pendiente = null; break;
    }
    case 'procesar':
      st.estado = 'procesado'; st.version += 1; st.procesado = { por: USUARIO, at: ahora() }; st.draft = {}; st.reabierto = null;
      guardar(); renderTodo(); mostrarHoja(r); return;
    case 'hoja': mostrarHoja(r); return;
    case 'reabrir':
      dialogo({ titulo: 'Reabrir el remito', texto: 'Vuelve a «En curso» con lo confirmado. Al procesarlo de nuevo, la hoja sale como versión ' + (st.version + 1) + '.', etiqueta: 'Motivo', obligatorio: true, confirmar: 'Reabrir',
        alConfirmar: (m) => { st.estado = 'en_curso'; st.reabierto = { motivo: m, por: USUARIO, at: ahora() }; guardar(); renderTodo(); } });
      return;
  }
  guardar(); renderTodo();
});

let temporizadorAviso = null;
function avisar(texto) {
  const t = $('#toast'); t.textContent = texto; t.hidden = false;
  clearTimeout(temporizadorAviso); temporizadorAviso = setTimeout(() => { t.hidden = true; }, 2500);
}
$('#reiniciar').addEventListener('click', () => {
  E = estadoInicial();
  $('#capa').innerHTML = '';
  renderTodo();
  window.scrollTo(0, 0);
  avisar('Demo reiniciada: todos los remitos vuelven a estar sin tocar.');
});

renderTodo();
</script>
